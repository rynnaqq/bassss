<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Simulasi Ujian & Pembelajaran</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax for LaTeX support -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.MathJax = {
          tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-md fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-graduation-cap mr-2"></i>EduSimulasi</h1>
            <div id="nav-timer" class="hidden font-mono text-lg font-bold bg-blue-800 px-3 py-1 rounded">
                <i class="fas fa-clock mr-1"></i> <span id="time-display">75:00</span>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 pt-20 pb-12 mt-4" id="app-container">
        
                <!-- Screen 1: Home / Subject Selection -->
        <section id="screen-home" class="block animate-fade-in">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-gray-900 mb-4">Pilih Mata Pelajaran</h2>
                <p class="text-gray-600 mb-6">Uji pemahaman Anda. Setiap sesi berdurasi 75 menit.</p>
                
                <!-- TOMBOL IMPORT BARU -->
                <div class="inline-block relative">
                    <input type="file" id="import-file" accept=".json" onchange="app.importData(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <button class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded font-medium transition shadow-sm">
                        <i class="fas fa-file-import mr-2"></i>Import Soal (JSON)
                    </button>
                </div>
                <!-- END TOMBOL IMPORT -->

            </div>
            <div class="grid md:grid-cols-3 gap-6 max-w-4xl mx-auto" id="subject-cards">
                <!-- Injected via JS -->
            </div>
        </section>


        <!-- Screen 2: Exam Area -->
        <section id="screen-exam" class="hidden animate-fade-in">
            <!-- Header Exam -->
            <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow-sm border">
                <h2 class="text-2xl font-bold text-gray-800" id="exam-title">Mata Pelajaran</h2>
                <button onclick="app.submitExam()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded font-medium transition">
                    <i class="fas fa-paper-plane mr-2"></i>Kumpulkan Ujian
                </button>
            </div>

            <!-- Question Container -->
            <div id="question-container" class="mb-8">
                <!-- Injected via JS -->
            </div>

            <!-- Navigation -->
            <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border">
                <button id="btn-prev" onclick="app.prevQuestion()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-2 rounded font-medium transition disabled:opacity-50">
                    <i class="fas fa-chevron-left mr-2"></i>Sebelumnya
                </button>
                <div id="question-indicator" class="font-medium text-gray-600">Soal 1 dari X</div>
                <button id="btn-next" onclick="app.nextQuestion()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-medium transition">
                    Selanjutnya<i class="fas fa-chevron-right ml-2"></i>
                </button>
            </div>
        </section>

        <!-- Screen 3: Review & Analytics -->
        <section id="screen-review" class="hidden animate-fade-in">
            <div class="bg-white p-8 rounded-lg shadow-md border mb-8 text-center">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Hasil Ujian</h2>
                <p class="text-gray-600 mb-6" id="review-subject">Mata Pelajaran</p>
                <div class="inline-block border-4 border-blue-500 rounded-full p-8 mb-4">
                    <div class="text-5xl font-bold text-blue-600" id="final-score">0</div>
                    <div class="text-sm text-gray-500 mt-1">Skor Akhir</div>
                </div>
                <div class="flex justify-center gap-8 text-lg mt-4">
                    <div class="text-green-600 font-medium"><i class="fas fa-check-circle mr-1"></i> <span id="count-correct">0</span> Benar</div>
                    <div class="text-red-600 font-medium"><i class="fas fa-times-circle mr-1"></i> <span id="count-wrong">0</span> Salah/Kosong</div>
                </div>
                <button onclick="app.goHome()" class="mt-8 bg-gray-800 hover:bg-gray-900 text-white px-6 py-2 rounded font-medium transition">
                    Kembali ke Beranda
                </button>
            </div>

            <h3 class="text-2xl font-bold text-gray-800 mb-6">Pembahasan Detail</h3>
            <div id="review-container" class="space-y-6">
                <!-- Injected via JS -->
            </div>
        </section>

    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
